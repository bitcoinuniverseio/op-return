<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="OP_RETURN: one carrier, three Bitcoin protocols">
  <rect width="1200" height="630" fill="#050907"/>
  <g stroke="#22332c" stroke-width="1">
    <path d="M0 90h1200M0 540h1200"/>
  </g>
  <g font-family="ui-monospace,Menlo,Consolas,monospace">
    <text x="80" y="60" fill="#3ce491" font-size="22" letter-spacing="6">BITCOIN MAINNET / DATA CARRIER OUTPUT</text>
    <text x="80" y="220" fill="#e4f1ea" font-size="76" font-weight="700">One carrier.</text>
    <text x="80" y="310" fill="#e4f1ea" font-size="76" font-weight="700">Three protocols.</text>
    <text x="80" y="372" fill="#9ab3a7" font-size="26">OP_RETURN, OP-20, OP Names, OP Inscriptions</text>

    <g transform="translate(80,420)">
      <rect x="0" y="0" width="90" height="62" rx="4" fill="#0c2b1d" stroke="#3ce491" stroke-width="2"/>
      <text x="18" y="30" fill="#3ce491" font-size="22">6a</text>
      <text x="8" y="52" fill="#9ab3a7" font-size="12">OP_RETURN</text>
      <rect x="100" y="0" width="70" height="62" rx="4" fill="#111d18" stroke="#3a5449" stroke-width="2"/>
      <text x="114" y="30" fill="#e4f1ea" font-size="22">34</text>
      <text x="108" y="52" fill="#9ab3a7" font-size="12">push 52</text>
      <rect x="180" y="0" width="700" height="62" rx="4" fill="#111d18" stroke="#3a5449" stroke-width="2" stroke-dasharray="6 4"/>
      <text x="196" y="30" fill="#e4f1ea" font-size="20">7b 22 70 22 3a 22 6f 70 2d 32 30 22 2c ...</text>
      <text x="196" y="52" fill="#9ab3a7" font-size="12">payload, UTF-8</text>
    </g>

    <text x="80" y="590" fill="#9ab3a7" font-size="20">bitcoinuniverseio.github.io/op-return</text>
  </g>
</svg>
